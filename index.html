<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KADOOSH — Sword & Shield</title>
<style>
  :root{
    --void:#080512; --nebula:#1b1038;
    --rune:#41e2ff; --rune-soft:rgba(65,226,255,.5); --rune-glow:rgba(65,226,255,.26);
    --arc:#b26bff; --arc-glow:rgba(178,107,255,.25);
    --ember:#ff3ec8; --ember-glow:rgba(255,62,200,.35);
    --text:#eae4f7; --text-dim:#8f86ad;
    --gold-1:#ffe2a0; --gold-2:#e9a530; --gold-edge:#a97a1e;
    --silver-1:#f4f9ff; --silver-2:#b9c8dd; --silver-edge:#8494ac;
    --danger:#ff486b;
    --display:"Copperplate","Copperplate Gothic Light",Palatino,"Times New Roman",serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{margin:0; height:100%;}
  body{
    background:
      radial-gradient(90% 60% at 20% -10%, rgba(178,107,255,.16) 0%, transparent 60%),
      radial-gradient(80% 55% at 85% 108%, rgba(255,62,200,.10) 0%, transparent 55%),
      radial-gradient(120% 90% at 50% -10%, #171033 0%, #0b0720 55%, var(--void) 100%);
    color:var(--text); font-family:"SF Pro Display","Helvetica Neue",system-ui,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%; padding:8px 10px 14px; gap:8px; overflow-x:hidden;
  }

  .panel{
    width:min(92vw,400px); display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 14px; border:1px solid rgba(65,226,255,.16); border-radius:14px;
    background:linear-gradient(180deg, rgba(37,24,72,.55), rgba(13,9,32,.85));
  }
  body.pvp .panel.silver{transform:rotate(180deg);}
  .panel.active{border-color:var(--rune); box-shadow:0 0 0 1px var(--rune), 0 0 24px -4px var(--rune-glow);}
  .who{display:flex; flex-direction:column; line-height:1.1;}
  .who .name{font-family:var(--display); font-size:14px; letter-spacing:.3em; text-transform:uppercase; font-weight:700;}
  .who.gold .name{color:var(--gold-1); text-shadow:0 0 12px rgba(233,165,48,.5);}
  .who.silver .name{color:var(--silver-1); text-shadow:0 0 12px rgba(185,200,221,.45);}
  .who .state{font-size:10.5px; letter-spacing:.16em; color:var(--text-dim); text-transform:uppercase; min-height:13px; margin-top:2px;}
  .pips{display:flex; gap:6px;}
  .pip{width:13px; height:13px; border-radius:50%; border:1px solid rgba(65,226,255,.3); background:#0c0824; transform:rotate(45deg); border-radius:3px;}
  .pip.on.gold{background:radial-gradient(circle at 35% 30%,var(--gold-1),var(--gold-2)); border-color:var(--gold-edge); box-shadow:0 0 9px -1px var(--gold-2);}
  .pip.on.silver{background:radial-gradient(circle at 35% 30%,var(--silver-1),var(--silver-2)); border-color:var(--silver-edge); box-shadow:0 0 9px -1px var(--silver-2);}
  .flipbtn{
    font-family:var(--display); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:700;
    color:#071018; background:linear-gradient(180deg,#7ee9ff,var(--rune)); border:1px solid #1585ad; border-radius:9px;
    padding:9px 12px; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .15s, transform .05s;
    min-width:112px; box-shadow:0 0 16px -3px var(--rune-glow);
  }
  .flipbtn.show{opacity:1; pointer-events:auto;}
  .flipbtn:active{transform:translateY(1px);}

  .crest{text-align:center; line-height:1;}
  .crest h1{
    margin:0; font-family:var(--display); font-size:27px; letter-spacing:.38em; font-weight:700;
    background:linear-gradient(180deg,#d8f5ff 10%, var(--rune) 55%, var(--arc) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-indent:.38em; filter:drop-shadow(0 0 14px var(--rune-glow));
  }
  .crest p{margin:4px 0 0; font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:var(--text-dim);}

  /* the summoning circle: a slow rune-ring behind the arena */
  .board-wrap{position:relative; width:min(92vw, 400px, calc(60vh * var(--ar,1))); margin:0 auto;}
  .board-wrap::before{
    content:""; position:absolute; inset:-7%; border-radius:50%; pointer-events:none; z-index:-1;
    background:conic-gradient(from 0deg, transparent 0 14deg, var(--arc-glow) 17deg 20deg, transparent 23deg 44deg, var(--rune-glow) 47deg 50deg, transparent 53deg 90deg, var(--arc-glow) 93deg 96deg, transparent 99deg 134deg, var(--rune-glow) 137deg 140deg, transparent 143deg 180deg, var(--arc-glow) 183deg 186deg, transparent 189deg 224deg, var(--rune-glow) 227deg 230deg, transparent 233deg 270deg, var(--arc-glow) 273deg 276deg, transparent 279deg 314deg, var(--rune-glow) 317deg 320deg, transparent 323deg 360deg);
    filter:blur(6px); opacity:.8; animation:runering 70s linear infinite;
  }
  @keyframes runering{to{transform:rotate(360deg);}}
  .board{
    width:100%; aspect-ratio:var(--ar,1); display:grid; gap:12px; padding:12px; border-radius:14px;
    background:radial-gradient(circle at 50% 38%, #150e30, #090617);
    box-shadow:0 0 48px -12px var(--rune-glow), inset 0 0 0 1px rgba(65,226,255,.22), inset 0 0 60px -20px var(--arc-glow);
  }
  .cell{
    position:relative; aspect-ratio:1/1; border-radius:8px;
    background:linear-gradient(180deg, rgba(31,20,60,.75), rgba(11,8,26,.9));
    box-shadow:inset 0 0 0 1.6px var(--rune-soft), inset 0 0 18px -3px var(--arc-glow), 0 0 10px -3px var(--rune-glow);
    display:flex; align-items:center; justify-content:center; cursor:default; padding:0; font:inherit;
  }
  .cell.target{cursor:pointer; box-shadow:inset 0 0 0 2px var(--rune), inset 0 0 24px -4px var(--rune-glow), 0 0 18px -3px var(--rune);}
  .cell.target::after{
    content:""; position:absolute; width:32%; height:32%; border-radius:50%; border:2px solid var(--rune);
    box-shadow:0 0 12px -1px var(--rune); animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(.7) rotate(45deg); opacity:.4;}50%{transform:scale(1.05) rotate(45deg); opacity:.95;}}

  .coin{width:80%; height:80%; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; cursor:default;}
  .coin.gold{background:radial-gradient(circle at 34% 28%, #fff3cf 0%, var(--gold-1) 22%, var(--gold-2) 66%, var(--gold-edge) 100%); box-shadow:inset 0 0 0 2px rgba(255,255,255,.4), inset 0 -5px 10px rgba(90,50,0,.35), 0 4px 12px -4px #000, 0 0 16px -5px var(--gold-2);}
  .coin.silver{background:radial-gradient(circle at 34% 28%, #ffffff 0%, var(--silver-1) 22%, var(--silver-2) 66%, var(--silver-edge) 100%); box-shadow:inset 0 0 0 2px rgba(255,255,255,.55), inset 0 -5px 10px rgba(20,35,60,.35), 0 4px 12px -4px #000, 0 0 16px -5px var(--silver-2);}
  .coin.mine{cursor:pointer;}
  .coin.selected{box-shadow:inset 0 0 0 2px rgba(255,255,255,.4), 0 0 0 3px var(--rune), 0 0 22px -2px var(--rune);}
  .coin svg{width:52%; height:52%;}
  .coin .ico-engrave{fill:#5c4410;}
  .coin.silver .ico-engrave{fill:#3a4a5c;}
  .coin.sword::before{content:""; position:absolute; inset:-3px; border-radius:50%; box-shadow:0 0 13px -1px var(--danger); opacity:.75;}
  .coin.sword.selected::before{opacity:.35;}
  .coin.dead{background:radial-gradient(circle at 40% 32%,#332a4d,#171226 70%,#0d0918); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), 0 3px 8px -3px #000; cursor:default;}
  .coin.dead.gold{outline:2px solid var(--gold-edge);}
  .coin.dead.silver{outline:2px solid var(--silver-edge);}
  .coin.dead .skull{fill:#cdd0e6;}
  .coin.dead .eye{fill:#0d0918;}

  .burst{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(0); pointer-events:none; z-index:50; opacity:0;}
  .burst.go{animation:kadoosh .8s cubic-bezier(.2,1.4,.4,1) forwards;}
  @keyframes kadoosh{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(-18deg);}
    25%{opacity:1; transform:translate(-50%,-50%) scale(1.15) rotate(6deg);}
    70%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(-3deg);}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1.05) rotate(0);}
  }
  .burst svg{display:block; filter:drop-shadow(0 0 16px rgba(65,226,255,.85));}
  .burst .kstar{fill:var(--rune); stroke:#0d5a7d;}
  .burst .word{font-family:"Arial Black",Impact,system-ui,sans-serif; font-weight:900; font-style:italic; font-size:30px; letter-spacing:.02em; fill:#fff; stroke:#0d5a7d; stroke-width:5px; paint-order:stroke;}
  .burst .kpre{font-family:"Arial Black",Impact,system-ui,sans-serif; font-weight:900; font-style:italic; font-size:19px; letter-spacing:.04em; fill:#fff; stroke:#0d5a7d; stroke-width:4px; paint-order:stroke;}
  .burst.red svg{filter:drop-shadow(0 0 18px var(--ember-glow));}
  .burst.red .kstar{fill:var(--ember); stroke:#6d1052;}
  .burst.red .word, .burst.red .kpre{stroke:#6d1052;}
  .burst.tall.go{animation:kadooshTall .9s cubic-bezier(.2,1.3,.4,1) forwards;}
  @keyframes kadooshTall{
    0%{opacity:0; transform:translate(-50%,-50%) rotate(-90deg) scale(calc(var(--k-scale,3) * .35));}
    22%{opacity:1; transform:translate(-50%,-50%) rotate(-90deg) scale(calc(var(--k-scale,3) * 1.06));}
    72%{opacity:1; transform:translate(-50%,-50%) rotate(-90deg) scale(var(--k-scale,3));}
    100%{opacity:0; transform:translate(-50%,-50%) rotate(-90deg) scale(calc(var(--k-scale,3) * 1.03));}
  }
  @media (prefers-reduced-motion:reduce){
    .burst.go{animation:kadooshRM .7s ease forwards;}
    @keyframes kadooshRM{0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}30%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;}}
    .burst.tall.go{animation:kadooshTallRM .7s ease forwards;}
    @keyframes kadooshTallRM{0%{opacity:0;transform:translate(-50%,-50%) rotate(-90deg) scale(var(--k-scale,3));}28%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50%) rotate(-90deg) scale(var(--k-scale,3));}}
    .cell.target::after{animation:none;}
    .board-wrap::before{animation:none;}
    .splash .sigil{animation:none;}
    .splash .tap{animation:none;}
  }

  .overlay{position:fixed; inset:0; background:rgba(6,4,14,.8); z-index:70; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .2s; backdrop-filter:blur(3px);}
  .overlay.show{opacity:1; pointer-events:auto;}
  .card{width:min(90vw,360px); text-align:center; background:linear-gradient(180deg,#1c1238,#0d0920); border:1px solid rgba(65,226,255,.25); border-radius:16px; padding:22px 20px; box-shadow:0 20px 50px -16px #000, 0 0 44px -16px var(--arc-glow);}
  .card h2{margin:0 0 6px; font-family:var(--display); font-size:20px; letter-spacing:.1em;}
  .card h2.gold{color:var(--gold-1);} .card h2.silver{color:var(--silver-1);}
  .card p{margin:0 0 16px; color:var(--text-dim); font-size:13px; line-height:1.5;}
  .card button{font-family:var(--display); font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:#071018; background:linear-gradient(180deg,#7ee9ff,var(--rune)); border:1px solid #1585ad; border-radius:10px; padding:11px 18px; cursor:pointer; box-shadow:0 0 18px -4px var(--rune-glow);}
  .card button:active{transform:translateY(1px);}

  .links{display:flex; gap:18px; margin-top:2px;}
  .links button{background:none; border:none; color:var(--text-dim); font-family:var(--display); font-size:11px; letter-spacing:.18em; text-transform:uppercase; cursor:pointer; padding:4px;}
  .links button:active{color:var(--rune);}

  .rules{text-align:left;}
  .rules p{color:var(--text); margin:0 0 9px;}
  .rules .flag{color:var(--rune); font-size:11.5px; line-height:1.5;}

  /* ---- tall (5x9) layout: board fills the screen; chrome trimmed to thin bars ---- */
  body.tall{height:100vh; height:100dvh; min-height:0; overflow:hidden; gap:6px; padding:6px 8px calc(8px + env(safe-area-inset-bottom));}
  body.tall .crest{display:none;}
  body.tall .panel{padding:4px 12px; flex:0 0 auto;}
  body.tall .who .name{font-size:11px; letter-spacing:.22em;}
  body.tall .who .state{font-size:9px; min-height:11px; margin-top:1px;}
  body.tall .pips{gap:4px;}
  body.tall .pip{width:9px; height:9px;}
  body.tall .flipbtn{min-width:88px; padding:6px 10px; font-size:10px;}
  body.tall .links{flex:0 0 auto; margin-top:0;}
  body.tall .board-wrap{flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center;}
  body.tall .board{height:min(100%, calc(96vw / var(--ar,1))); width:auto; aspect-ratio:var(--ar,1);}
  body.tall .board-wrap::before{inset:8% -18%;}

  /* ---- start screen ---- */
  .start{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:22px;
    background:
      radial-gradient(90% 60% at 15% -8%, rgba(178,107,255,.18) 0%, transparent 60%),
      radial-gradient(85% 55% at 88% 106%, rgba(255,62,200,.12) 0%, transparent 55%),
      radial-gradient(120% 90% at 50% 10%, #171033 0%, #0b0720 55%, var(--void) 100%);
    opacity:0; pointer-events:none; transition:opacity .25s; overflow:auto;}
  .start.show{opacity:1; pointer-events:auto;}
  .start-card{width:min(92vw,380px); text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px;}
  .start .crest h1{font-size:40px;}
  .start .crest p{font-size:11px; margin-top:6px;}
  .seg-label{font-family:var(--display); font-size:10.5px; letter-spacing:.3em; text-transform:uppercase; color:var(--text-dim); margin-bottom:9px;}
  .boards{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; width:100%;}
  .board-btn{display:flex; flex-direction:column; gap:3px; align-items:center; font:inherit; font-size:13px; font-weight:700; letter-spacing:.06em;
    color:var(--text); background:linear-gradient(180deg,#20153f,#110b26); border:1px solid rgba(65,226,255,.28); border-radius:10px; padding:12px 4px; cursor:pointer;}
  .board-btn small{font-size:9px; letter-spacing:.1em; color:var(--text-dim); font-weight:600;}
  .board-btn.sel{border-color:var(--rune); box-shadow:0 0 0 1px var(--rune), 0 0 18px -5px var(--rune-glow); color:#d8f5ff;}
  .board-btn:active{transform:translateY(1px);}
  .modes{width:100%; display:flex; flex-direction:column; gap:14px;}
  .big-btn{width:100%; font-family:var(--display); font-size:14px; letter-spacing:.2em; text-transform:uppercase; font-weight:700;
    color:#071018; background:linear-gradient(180deg,#7ee9ff,var(--rune)); border:1px solid #1585ad; border-radius:12px; padding:16px; cursor:pointer; box-shadow:0 0 24px -6px var(--rune-glow);}
  .big-btn:active{transform:translateY(1px);}
  .cpu-block{border:1px solid rgba(65,226,255,.18); border-radius:14px; padding:14px 14px 12px; background:linear-gradient(180deg, rgba(32,21,63,.6), rgba(13,9,30,.85));}
  .lvls{display:grid; grid-template-columns:repeat(2,1fr); gap:9px;}
  .lvl-btn{display:flex; align-items:center; gap:9px; justify-content:flex-start; font-family:var(--display); font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--text);
    background:linear-gradient(180deg,#20153f,#110b26); border:1px solid rgba(65,226,255,.3); border-radius:10px; padding:8px 10px; cursor:pointer;}
  .lvl-face{width:34px; height:34px; flex:0 0 auto; filter:drop-shadow(0 0 6px rgba(65,226,255,.35));}
  .lvl-face svg{width:100%; height:100%; display:block;}
  .lvl-btn[data-level="prince"]{border-color:rgba(178,107,255,.45);}
  .lvl-btn[data-level="king"]{border-color:rgba(255,182,80,.5); color:#ffe2a0;}
  .lvl-btn[data-level="king"] .lvl-face{filter:drop-shadow(0 0 6px rgba(233,165,48,.5));}
  .lvl-btn[data-level="superking"]{border-color:rgba(255,62,200,.55); color:#ffd2ef; background:linear-gradient(180deg,#2b1030,#150a1c); box-shadow:0 0 18px -5px var(--ember-glow);}
  .lvl-btn[data-level="superking"] .lvl-face{filter:drop-shadow(0 0 7px var(--ember-glow));}
  .lvl-btn:active{transform:translateY(1px); border-color:var(--rune);}
  .lvl-hint{margin-top:10px; font-size:10px; letter-spacing:.06em; color:var(--text-dim);}
  .ver{font-size:11px; letter-spacing:.3em; color:var(--text-dim);}
  .howto{font-family:var(--display); font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; font-weight:700; color:var(--rune);
    background:linear-gradient(180deg, rgba(32,21,63,.6), rgba(13,9,30,.85)); border:1px solid rgba(65,226,255,.35); border-radius:9px; padding:10px 18px; cursor:pointer;}
  .howto:active{transform:translateY(1px);}

  /* ---- opening splash ---- */
  .splash{position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    background:
      radial-gradient(70% 45% at 50% 30%, rgba(65,226,255,.10) 0%, transparent 60%),
      radial-gradient(120% 90% at 50% 110%, #170f31 0%, #0a0618 60%, #060410 100%);
    opacity:1; transition:opacity .45s; cursor:pointer;}
  .splash.hide{opacity:0; pointer-events:none;}
  .splash .sigil{width:min(58vw,240px); filter:drop-shadow(0 0 22px var(--rune-glow)); animation:sigil 3.2s ease-in-out infinite;}
  @keyframes sigil{0%,100%{transform:scale(1); filter:drop-shadow(0 0 18px var(--rune-glow));}50%{transform:scale(1.04); filter:drop-shadow(0 0 34px var(--rune-glow));}}
  .splash h1{margin:0; font-family:var(--display); font-size:34px; letter-spacing:.44em; text-indent:.44em; font-weight:700;
    background:linear-gradient(180deg,#d8f5ff 10%, var(--rune) 55%, var(--arc) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 16px var(--rune-glow));}
  .splash .sub{margin:-16px 0 0; font-size:10px; letter-spacing:.4em; text-transform:uppercase; color:var(--text-dim);}
  .splash .tap{font-family:var(--display); font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--text-dim); animation:tapfade 1.8s ease-in-out infinite;}
  @keyframes tapfade{0%,100%{opacity:.35;}50%{opacity:.95;}}

  /* ---- encounter (versus) card ---- */
  .vs-face{width:96px; height:96px; margin:0 auto 6px; filter:drop-shadow(0 0 14px var(--rune-glow));}
  .vs-face svg{width:100%; height:100%; display:block;}
  .vs-eyebrow{font-family:var(--display); font-size:10px; letter-spacing:.4em; text-transform:uppercase; color:var(--text-dim); margin:0 0 4px;}
  .vs-name{font-family:var(--display); font-size:24px; letter-spacing:.16em; text-transform:uppercase; margin:0 0 6px; color:#d8f5ff;}
  .vs-name.king{color:var(--gold-1);} .vs-name.superking{color:#ffd2ef;}
  .vs-tag{color:var(--text-dim); font-size:13px; line-height:1.5; margin:0 0 18px;}
  .vs-row{display:flex; gap:10px; justify-content:center;}
  .vs-row .ghost{background:none; color:var(--text-dim); border:1px solid rgba(65,226,255,.3); box-shadow:none;}
</style>
</head>
<body>

  <div class="panel silver" id="panel-S">
    <div class="who silver"><span class="name">Silver</span><span class="state" id="state-S"></span></div>
    <div class="pips" id="pips-S"></div>
    <button class="flipbtn" id="flip-S">Flip</button>
  </div>

  <div class="crest"><h1>KADOOSH</h1><p>Sword &amp; Shield · best of 9</p></div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="panel gold" id="panel-G">
    <div class="who gold"><span class="name">Gold</span><span class="state" id="state-G"></span></div>
    <div class="pips" id="pips-G"></div>
    <button class="flipbtn" id="flip-G">Flip</button>
  </div>

  <div class="links">
    <button id="btn-menu">Menu</button>
    <button id="btn-rules">Rules</button>
    <button id="btn-new">New match</button>
  </div>

  <div class="burst" id="burst">
    <svg width="220" height="172" viewBox="0 0 220 172">
      <polygon class="kstar" stroke-width="3"
        points="110,10 130,52 178,36 158,78 214,86 158,98 184,146 132,118 118,162 102,118 44,146 64,98 6,86 64,76 40,36 90,52"/>
      <text class="kpre" x="110" y="62" text-anchor="middle"></text>
      <text class="word" x="110" y="104" text-anchor="middle">KADOOSH!</text>
    </svg>
  </div>

  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>

  <div class="splash" id="splash">
    <svg class="sigil" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="92" fill="none" stroke="#41e2ff" stroke-opacity=".35" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#b26bff" stroke-opacity=".3" stroke-width="1" stroke-dasharray="3 9"/>
      <polygon fill="none" stroke="#41e2ff" stroke-opacity=".8" stroke-width="2"
        points="100,22 118,60 160,46 143,84 190,92 143,102 166,144 121,120 108,160 93,120 44,144 61,102 12,92 61,84 40,46 82,60"/>
      <polygon fill="#41e2ff" fill-opacity=".14"
        points="100,22 118,60 160,46 143,84 190,92 143,102 166,144 121,120 108,160 93,120 44,144 61,102 12,92 61,84 40,46 82,60"/>
      <g stroke="#41e2ff" stroke-width="2.4" stroke-linecap="round" fill="none">
        <path d="M84 76 L84 118 M84 88 L74 78 M84 88 L94 78"/>
        <path d="M116 76 C104 82 104 112 116 118 M116 76 L124 76 M116 118 L124 118"/>
      </g>
    </svg>
    <h1>KADOOSH</h1>
    <p class="sub">Sword &amp; Shield</p>
    <div class="tap">Tap to enter the arena</div>
  </div>

  <div class="start show" id="start">
    <div class="start-card">
      <div class="crest"><h1>KADOOSH</h1><p>Sword &amp; Shield</p></div>
      <div style="width:100%">
        <div class="seg-label">Board</div>
        <div class="boards" id="boards">
          <button class="board-btn sel" data-board="3x3">3 × 3<small>3 each</small></button>
          <button class="board-btn" data-board="5x5">5 × 5<small>5 each</small></button>
          <button class="board-btn" data-board="9x5">5 × 9<small>5 each</small></button>
        </div>
      </div>
      <div class="modes">
        <button class="big-btn" data-mode="pvp">Two players</button>
        <div class="cpu-block">
          <div class="seg-label" style="margin-bottom:11px">Play vs CPU</div>
          <div class="lvls">
            <button class="lvl-btn" data-level="knight"><span class="lvl-face" data-face="knight"></span><span>Knight</span></button>
            <button class="lvl-btn" data-level="prince"><span class="lvl-face" data-face="prince"></span><span>Prince</span></button>
            <button class="lvl-btn" data-level="king"><span class="lvl-face" data-face="king"></span><span>King</span></button>
            <button class="lvl-btn" data-level="superking"><span class="lvl-face" data-face="superking"></span><span>Superking</span></button>
          </div>
          <div class="lvl-hint">Superking searches deep — good luck</div>
        </div>
      </div>
      <button class="howto" id="btn-howto">How to play</button>
      <div class="ver" id="ver">v1.7.0</div>
    </div>
  </div>

<script>
"use strict";
(function(){
  const VERSION = "v1.7.0";
  const WIN_ROUNDS = 5;
  const ENEMY = {S:'G', G:'S'};
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  const ICONS = {
    shield: '<svg viewBox="0 0 24 24"><path class="ico-engrave" d="M12 2 L20 5 V11 C20 16 16.4 19.6 12 22 C7.6 19.6 4 16 4 11 V5 Z M12 4.4 L6 6.6 V11 C6 14.6 8.7 17.4 12 19.4 C15.3 17.4 18 14.6 18 11 V6.6 Z"/></svg>',
    sword:  '<svg viewBox="0 0 24 24"><path class="ico-engrave" d="M13.2 2 L15 3.9 V12.4 H11.7 V3.9 Z M9 12.4 H17.3 V14.1 H9 Z M12.3 14.1 H14 V19 H12.3 Z M9.8 19 H16.5 V20.8 H9.8 Z"/></svg>',
    skull:  '<svg viewBox="0 0 24 24"><path class="skull" d="M12 2.4 C7.3 2.4 4 6.1 4 10.8 C4 13.6 5.4 15.5 6.7 16.6 V19.4 H8.7 V17.6 H10.6 V19.4 H13.4 V17.6 H15.3 V19.4 H17.3 V16.6 C18.6 15.5 20 13.6 20 10.8 C20 6.1 16.7 2.4 12 2.4 Z"/><circle class="eye" cx="9.1" cy="11" r="2"/><circle class="eye" cx="14.9" cy="11" r="2"/></svg>'
  };

  const BOARDS = {
    '3x3':{rows:3, cols:3, tokens:3},
    '5x5':{rows:5, cols:5, tokens:5},
    '9x5':{rows:9, cols:5, tokens:5}
  };

  // ---------- board geometry (rebuilt per board choice) ----------
  let ROWS=3, COLS=3, TOKENS=3, N=9, NB=[], DRAW_LIMIT=24;
  function buildBoard(rows,cols,tokens){
    ROWS=rows; COLS=cols; TOKENS=tokens; N=rows*cols;
    NB=new Array(N);
    for(let i=0;i<N;i++){ const r=(i/cols|0), c=i%cols, o=[];
      if(r>0)o.push(i-cols); if(r<rows-1)o.push(i+cols);
      if(c>0)o.push(i-1); if(c<cols-1)o.push(i+1);
      NB[i]=o;
    }
    DRAW_LIMIT = Math.min(60, Math.max(24, N*2));
  }
  const neighbors = i => NB[i];

  function applyBoardLayout(){
    const wrap=document.querySelector('.board-wrap'), board=document.getElementById('board');
    wrap.style.setProperty('--ar', (COLS/ROWS));
    board.style.gridTemplateColumns='repeat('+COLS+',1fr)';
    board.style.gridTemplateRows='repeat('+ROWS+',1fr)';
    const big=Math.max(ROWS,COLS);
    const gap = big<=3?12 : big<=5?8 : 6;
    board.style.gap=gap+'px'; board.style.padding=gap+'px';
    document.body.classList.toggle('tall', ROWS>COLS);
  }

  // ---------- live state ----------
  let cells, turn, starter, selected, lastMove, score, busy, matchOver;
  let mode='pvp', level=null, cpuSide=null, awaitingContinue=false, thinking=false;
  let lastKiller=null, quiet=0;

  function newRound(){
    cells = new Array(N).fill(null);
    for(let c=0;c<COLS;c++){ cells[c]={owner:'S',face:'shield'}; cells[(ROWS-1)*COLS+c]={owner:'G',face:'shield'}; }
    turn = starter; selected = null; lastMove = {S:null, G:null};
    busy = false; awaitingContinue = false; thinking = false;
    lastKiller = null; quiet = 0;
    render(); maybeCpu();
  }
  function newMatch(){ score = {S:0, G:0}; starter = 'S'; matchOver = false; newRound(); }

  // ---------- legality (no undo of your own last move) ----------
  function isUndoMove(from,to){ const lm=lastMove[turn]; return lm && lm.t==='move' && lm.from===to && lm.to===from; }
  function isUndoFlip(i){ const lm=lastMove[turn]; return lm && lm.t==='flip' && lm.idx===i; }
  function legalTargets(i){ return neighbors(i).filter(n=> cells[n]===null && !isUndoMove(i,n)); }
  function canFlip(i){ return cells[i] && cells[i].face!=='skull' && !isUndoFlip(i); }

  // ---------- combat ----------
  // KADOOSH (blade) deaths, resolved across the whole board after a move:
  //  - an enemy SWORD beside one of the mover's swords is taken (you win the clash you create),
  //  - ANY shield next to 2+ enemy swords falls — including a shield that just moved into them.
  function resolveAll(arr, active){
    const kills = [];
    for(let i=0;i<N;i++){
      const e = arr[i]; if(!e || e.face==='skull') continue;
      if(e.face==='sword'){
        // an enemy-of-mover sword falls if a mover sword sits beside it (mover wins the clash)
        if(e.owner!==active){
          for(const n of neighbors(i)){ const a=arr[n]; if(a && a.owner===active && a.face==='sword'){ kills.push(i); break; } }
        }
      } else {
        // a shield falls when 2+ of its enemy's swords surround it (incl. a shield that moved in)
        const foe = ENEMY[e.owner];
        let sw=0; for(const n of neighbors(i)){ const a=arr[n]; if(a && a.owner===foe && a.face==='sword') sw++; }
        if(sw>=2) kills.push(i);
      }
    }
    return kills;
  }
  function aliveIn(arr,owner){ let n=0; for(const c of arr) if(c && c.owner===owner && c.face!=='skull') n++; return n; }

  // Treating skulls as walls, can any Silver and Gold token ever become adjacent?
  // If the two armies sit in separate regions, no further clash is possible.
  function contactPossible(arr){
    const comp=new Array(N).fill(false);
    for(let i=0;i<N;i++){
      if(comp[i]) continue;
      const c0=arr[i]; if(c0 && c0.face==='skull') continue;
      let hasS=false, hasG=false; const stack=[i]; comp[i]=true;
      while(stack.length){ const x=stack.pop(); const t=arr[x];
        if(t && t.face!=='skull'){ if(t.owner==='S')hasS=true; else if(t.owner==='G')hasG=true; }
        for(const n of neighbors(x)){ const e=arr[n]; if(!comp[n] && !(e&&e.face==='skull')){ comp[n]=true; stack.push(n); } }
      }
      if(hasS && hasG) return true;
    }
    return false;
  }

  // ---------- actions ----------
  function doMove(from,to){ cells[to]=cells[from]; cells[from]=null; lastMove[turn]={t:'move',from,to}; finishTurn(); }
  function doFlip(i){ cells[i].face = cells[i].face==='shield'?'sword':'shield'; lastMove[turn]={t:'flip',idx:i}; finishTurn(); }

  function hasAnyLegalMove(p){
    const lm=lastMove[p];
    for(let i=0;i<N;i++){ const t=cells[i]; if(!t||t.owner!==p||t.face==='skull') continue;
      for(const n of neighbors(i)){ if(cells[n]===null && !(lm&&lm.t==='move'&&lm.from===n&&lm.to===i)) return true; }
      if(!(lm&&lm.t==='flip'&&lm.idx===i)) return true;
    }
    return false;
  }

  // tokens whose every on-board neighbour is an enemy shield are boxed in and die (KABOOSHED)
  // KABOOSHED: a piece that can't move — every on-board neighbour is a skull or an enemy
  // piece (no empty square and no friendly piece beside it) — is crushed. Cascades.
  function boxedKills(arr){
    const out=[]; let changed=true;
    while(changed){ changed=false;
      for(let i=0;i<N;i++){ const t=arr[i]; if(!t||t.face==='skull') continue;
        const ns=neighbors(i); if(!ns.length) continue;
        let boxed=true;
        for(const j of ns){ const e=arr[j];
          if(!e || (e.owner===t.owner && e.face!=='skull')){ boxed=false; break; } // empty or friendly piece -> not boxed
        }
        if(boxed){ arr[i].face='skull'; out.push(i); changed=true; }
      }
    }
    return out;
  }
  function finishTurn(){
    selected=null;
    const swordK=resolveAll(cells,turn); swordK.forEach(k=> cells[k].face='skull');
    const boxK=boxedKills(cells);
    swordK.concat(boxK).forEach(k=>{ lastKiller=ENEMY[cells[k].owner]; });
    if(swordK.length+boxK.length){
      quiet=0; busy=true; render();
      const red = swordK.length===0;
      const at = swordK.length?swordK[0]:boxK[0];
      splash(at, red?'KABOOSHED':'KADOOSH', red, red?1:swordK.length, ()=>{ busy=false; concludeTurn(); });
    } else concludeTurn();
  }
  function concludeTurn(){
    const aS=aliveIn(cells,'S'), aG=aliveIn(cells,'G');
    if(aS===0 || aG===0){ concludeRound(aS,aG,false); return; }            // a side wiped out
    if(!contactPossible(cells)){ concludeRound(aS,aG,true); return; }       // armies can never meet -> last kill wins
    turn=ENEMY[turn]; quiet++;
    if(!hasAnyLegalMove(turn) || quiet>=DRAW_LIMIT){ concludeRound(aliveIn(cells,'S'),aliveIn(cells,'G'),true); return; }
    render(); maybeCpu();
  }
  function concludeRound(aS,aG,draw){
    let winner;
    if(!draw && aS>0 && aG===0) winner='S';
    else if(!draw && aG>0 && aS===0) winner='G';
    else winner = lastKiller || (aS>aG?'S':aG>aS?'G':ENEMY[starter]); // stalemate -> last to kill wins
    awardRound(winner);
  }
  function awardRound(winner){
    score[winner]++; render();
    if(score[winner]>=WIN_ROUNDS){ matchOver=true; showMatchEnd(winner); }
    else { awaitingContinue=true; showRoundEnd(winner); }
  }

  // ---------- CPU ----------
  let NODES=0, NODE_CAP=120000, DEADLINE=Infinity;
  function genMoves(c, t, last, ignore){
    const out=[];
    for(let i=0;i<N;i++){ const tok=c[i]; if(!tok||tok.owner!==t||tok.face==='skull') continue;
      for(const n of neighbors(i)){ if(c[n]===null){ const undo = !ignore && last[t] && last[t].t==='move' && last[t].from===n && last[t].to===i; if(!undo) out.push({t:'move',from:i,to:n}); } }
      const fundo = !ignore && last[t] && last[t].t==='flip' && last[t].idx===i;
      if(!fundo) out.push({t:'flip',idx:i});
    }
    return out;
  }
  function moves(s){ return genMoves(s.c,s.turn,s.last,false); }
  function apply(s,mv){
    const c=s.c.map(e=> e?{owner:e.owner,face:e.face}:null);
    if(mv.t==='move'){ c[mv.to]=c[mv.from]; c[mv.from]=null; }
    else { c[mv.idx].face = c[mv.idx].face==='shield'?'sword':'shield'; }
    const sk=resolveAll(c, s.turn); sk.forEach(k=> c[k].face='skull');
    const bx=boxedKills(c);
    let lk=s.lk||null; sk.concat(bx).forEach(k=> lk=ENEMY[c[k].owner]);
    const last={S:s.last.S?Object.assign({},s.last.S):null, G:s.last.G?Object.assign({},s.last.G):null};
    last[s.turn]= mv.t==='move'?{t:'move',from:mv.from,to:mv.to}:{t:'flip',idx:mv.idx};
    return {c, turn:ENEMY[s.turn], last, lk};
  }
  function killable(c,i){
    const tok=c[i]; if(!tok||tok.face==='skull') return false;
    const att=ENEMY[tok.owner];
    let adjSwords=0, adjShields=0; const empties=[];
    for(const j of neighbors(i)){ const e=c[j];
      if(e){ if(e.owner===att && e.face==='sword') adjSwords++; if(e.owner===att && e.face==='shield') adjShields++; }
      else empties.push(j);
    }
    let canAdd = adjShields>0;
    if(!canAdd) for(const j of empties){ for(const k of neighbors(j)){ const a=c[k]; if(a && a.owner===att && a.face==='sword' && k!==i){ canAdd=true; break; } } if(canAdd) break; }
    if(tok.face==='sword') return adjSwords>=1 || canAdd;
    return adjSwords>=2 || (adjSwords===1 && canAdd);
  }
  function threatenedCount(c,victim){
    let n=0;
    for(let i=0;i<N;i++){ const t=c[i]; if(t && t.owner===victim && t.face!=='skull' && killable(c,i)) n++; }
    return n;
  }
  function evalFor(s,me){
    const opp=ENEMY[me], myA=aliveIn(s.c,me), opA=aliveIn(s.c,opp);
    if(opA===0) return 100000; if(myA===0) return -100000;
    let sc=1000*(myA-opA);
    sc -= 140*threatenedCount(s.c,me);
    sc += 120*threatenedCount(s.c,opp);
    return sc;
  }
  // A decided round (armies walled apart, or the side to move is stuck): last strike wins.
  function decided(s, me, depth){
    const myA=aliveIn(s.c,me), opA=aliveIn(s.c,ENEMY[me]);
    let win;
    if(s.lk) win=(s.lk===me);
    else if(myA!==opA) win=(myA>opA);
    else win=(ENEMY[starter]===me);
    return win ? (90000+depth) : -(90000+depth);
  }
  function negamax(s,depth,alpha,beta){
    const me=s.turn;
    if(++NODES>NODE_CAP || ((NODES&1023)===0 && Date.now()>DEADLINE)) return evalFor(s,me);
    const myA=aliveIn(s.c,me), opA=aliveIn(s.c,ENEMY[me]);
    if(opA===0) return 100000+depth;
    if(myA===0) return -100000-depth;
    if(!contactPossible(s.c)) return decided(s,me,depth);
    if(depth===0) return evalFor(s,me);
    const ms=moves(s);
    if(ms.length===0) return decided(s,me,depth);
    if(depth>=2) ms.sort((a,b)=> evalFor(apply(s,b),me)-evalFor(apply(s,a),me));
    let best=-Infinity;
    for(const mv of ms){ const v=-negamax(apply(s,mv),depth-1,-beta,-alpha); if(v>best)best=v; if(best>alpha)alpha=best; if(alpha>=beta)break; }
    return best;
  }
  function cpuDepth(){
    if(level==='knight') return 1;
    if(level==='prince') return N<=9?3:2;
    return N<=9?5:3; // king
  }
  function rootState(){
    return { c:cells.map(e=> e?{owner:e.owner,face:e.face}:null), turn,
             last:{S:lastMove.S?Object.assign({},lastMove.S):null, G:lastMove.G?Object.assign({},lastMove.G):null},
             lk:lastKiller };
  }
  // Superking: iterative deepening, going as deep as an ~850ms budget allows.
  function iterativeDeepen(s, ms){
    DEADLINE = Date.now()+750; NODE_CAP = 2500000;
    ms.sort((a,b)=> evalFor(apply(s,b),cpuSide)-evalFor(apply(s,a),cpuSide));
    let best=ms[0];
    for(let d=1; d<=18; d++){
      let alpha=-Infinity, localBest=null, aborted=false;
      for(const mv of ms){
        if(NODES>NODE_CAP || Date.now()>DEADLINE){ aborted=true; break; }
        const v=-negamax(apply(s,mv), d-1, -Infinity, -alpha);
        if(localBest===null || v>alpha){ alpha=v; localBest=mv; }
      }
      if(localBest && !aborted){ best=localBest; ms=[localBest, ...ms.filter(m=>m!==localBest)];
        if(alpha>=90000) break; // forced win found — no need to search deeper
      } else break;
    }
    return best;
  }
  function chooseCpuMove(){
    NODES=0; DEADLINE=Infinity; NODE_CAP=120000;
    const s=rootState();
    const ms=moves(s); if(ms.length===0) return null;
    if(level==='knight' && Math.random()<0.35) return ms[(Math.random()*ms.length)|0];
    if(level==='superking') return iterativeDeepen(s, ms);
    const depth=cpuDepth();
    ms.sort((a,b)=> evalFor(apply(s,b),cpuSide)-evalFor(apply(s,a),cpuSide));
    let best=ms[0], bestV=-Infinity;
    for(const mv of ms){ const v=-negamax(apply(s,mv),depth-1,-Infinity,Infinity); if(v>bestV){ bestV=v; best=mv; } }
    return best;
  }
  function maybeCpu(){
    if(mode!=='cpu'||matchOver||busy||awaitingContinue||turn!==cpuSide) return;
    thinking=true; renderPanels();
    setTimeout(()=>{
      if(mode!=='cpu'||matchOver||awaitingContinue||turn!==cpuSide){ thinking=false; return; }
      const mv=chooseCpuMove(); thinking=false;
      if(!mv){ render(); return; }
      if(mv.t==='move') doMove(mv.from,mv.to); else doFlip(mv.idx);
    }, 460);
  }

  // ---------- KADOOSH ----------
  function splash(idx, word, red, count, done){
    const burst=document.getElementById('burst'), board=document.getElementById('board');
    const pre = count>=5?'MEGA':({2:'DOUBLE',3:'TRIPLE',4:'QUADRUPLE'}[count]||'');
    burst.querySelector('.kpre').textContent = pre;
    const w=burst.querySelector('.word'); w.textContent=word+'!'; w.style.fontSize=(word.length>=9?24:30)+'px';
    burst.classList.toggle('red', red);
    const tall=document.body.classList.contains('tall');
    burst.classList.toggle('tall', tall);
    if(tall){
      burst.style.left='50%'; burst.style.top='50%';
      burst.style.setProperty('--k-scale', Math.max(2.0, window.innerHeight/220).toFixed(2));
    } else {
      const tr=board.children[idx].getBoundingClientRect();
      burst.style.left=(tr.left+tr.width/2)+'px';
      burst.style.top=(tr.top+tr.height/2)+'px';
    }
    burst.classList.remove('go'); void burst.offsetWidth; burst.classList.add('go');
    setTimeout(done, tall?900:780);
  }

  // ---------- render ----------
  function render(){
    const board=document.getElementById('board'); board.innerHTML='';
    const sel=selected, targets = sel!=null ? legalTargets(sel) : [];
    for(let i=0;i<N;i++){
      const isTarget=targets.includes(i);
      const cell=document.createElement(isTarget?'button':'div');
      cell.className='cell'+(isTarget?' target':'');
      const t=cells[i];
      if(t){
        const coin=document.createElement('div');
        const mine=(t.owner===turn && t.face!=='skull' && !busy && !matchOver && !(mode==='cpu'&&turn===cpuSide));
        coin.className='coin '+(t.owner==='G'?'gold':'silver')+(t.face==='sword'?' sword':'')+(t.face==='skull'?' dead':'')+(mine?' mine':'')+(i===sel?' selected':'');
        coin.innerHTML=ICONS[t.face];
        if(mine) coin.onclick=(e)=>{ e.stopPropagation(); selectCoin(i); };
        cell.appendChild(coin);
      }
      if(isTarget) cell.onclick=()=> doMove(sel,i);
      board.appendChild(cell);
    }
    renderPanels();
  }
  function renderPanels(){
    for(const p of ['S','G']){
      document.getElementById('panel-'+p).classList.toggle('active', turn===p && !matchOver && !awaitingContinue);
      const box=document.getElementById('pips-'+p); box.innerHTML='';
      for(let k=0;k<WIN_ROUNDS;k++){ const pip=document.createElement('div'); pip.className='pip '+(p==='G'?'gold':'silver')+(k<score[p]?' on':''); box.appendChild(pip); }
      let label='';
      if(matchOver) label='';
      else if(mode==='cpu' && p===cpuSide) label = thinking?'thinking…':('CPU · '+cap(level));
      else if(turn===p) label = (selected!=null?'choose a square':'your move');
      document.getElementById('state-'+p).textContent=label;
      const fb=document.getElementById('flip-'+p);
      const show=(turn===p && selected!=null && !busy && !matchOver && canFlip(selected) && !(mode==='cpu'&&p===cpuSide));
      fb.classList.toggle('show', show);
      if(show){ fb.textContent = cells[selected].face==='shield'?'Draw sword':'Raise shield'; fb.onclick=()=> doFlip(selected); }
      else fb.onclick=null;
    }
  }
  function selectCoin(i){ if(busy||matchOver) return; selected=(selected===i)?null:i; render(); }

  // ---------- overlays ----------
  const overlay=document.getElementById('overlay'), card=document.getElementById('card');
  function showOverlay(html){ card.innerHTML=html; overlay.classList.add('show'); }
  function hideOverlay(){ overlay.classList.remove('show'); }
  function showRoundEnd(winner){
    const name=winner==='G'?'Gold':'Silver';
    showOverlay('<h2 class="'+(winner==='G'?'gold':'silver')+'">'+name+' wins the round</h2>'+
      '<p>Match &nbsp;Silver '+score.S+' — '+score.G+' Gold<br>'+(ENEMY[winner]==='S'?'Silver':'Gold')+' starts next.</p>'+
      '<button id="ov-next">Next round</button>');
    document.getElementById('ov-next').onclick=()=>{ hideOverlay(); starter=ENEMY[starter]; newRound(); };
  }
  function showMatchEnd(winner){
    const name=winner==='G'?'Gold':'Silver';
    showOverlay('<h2 class="'+(winner==='G'?'gold':'silver')+'">'+name+' takes the match</h2>'+
      '<p>Final &nbsp;Silver '+score.S+' — '+score.G+' Gold</p><button id="ov-again">New match</button>');
    document.getElementById('ov-again').onclick=()=>{ hideOverlay(); newMatch(); };
  }

  // ---------- links / start ----------
  document.getElementById('btn-new').onclick=()=>{ hideOverlay(); newMatch(); };
  document.getElementById('btn-menu').onclick=()=>{ hideOverlay(); startShow(); };
  function showRules(){
    showOverlay('<div class="rules"><h2 style="text-align:center">How it plays</h2>'+
      '<p>Tap one of your tokens, then tap a glowing square to <b>move</b> (up/down/left/right into an empty square), or use <b>flip</b> to switch between shield and sword.</p>'+
      '<p>End your turn as a <b>sword</b> next to an enemy <b>sword</b> to take it — <i>KADOOSH</i>. A <b>shield</b> blocks a single sword, but a shield with <b>two</b> enemy swords beside it falls — so moving a shield next to two enemy swords gets it <i>KADOOSHED</i> too. Take two, three or four foes in one move for a <i>DOUBLE</i>, <i>TRIPLE</i> or <i>QUADRUPLE KADOOSH</i>.</p>'+
      '<p>A piece that can\'t move — every side blocked by skulls or enemy pieces — is crushed: <i>KABOOSHED</i>. So you can win a piece by boxing it in.</p>'+
      '<p>Take out all enemy tokens to win the round. If the two sides are walled apart by skulls and can never meet again, the round goes to whoever struck last. First to '+WIN_ROUNDS+' rounds wins. You can\'t undo your own last move.</p>'+
      '</div><div style="text-align:center"><button id="ov-close">Got it</button></div>');
    document.getElementById('ov-close').onclick=hideOverlay;
  }
  document.getElementById('btn-rules').onclick=showRules;
  document.getElementById('btn-howto').onclick=showRules;

  const startEl=document.getElementById('start');
  let selectedBoardKey='3x3';
  function startShow(){ startEl.classList.add('show'); }
  function startHide(){ startEl.classList.remove('show'); }
  function startGame(m, lvl){
    mode=m; level=lvl||null; cpuSide = (m==='cpu') ? 'S' : null;
    document.body.classList.toggle('pvp', m==='pvp');
    const cfg=BOARDS[selectedBoardKey]; buildBoard(cfg.rows,cfg.cols,cfg.tokens); applyBoardLayout();
    startHide(); newMatch();
  }
  document.getElementById('boards').querySelectorAll('.board-btn').forEach(b=> b.onclick=()=>{
    selectedBoardKey=b.dataset.board;
    document.getElementById('boards').querySelectorAll('.board-btn').forEach(x=> x.classList.toggle('sel', x===b));
  });
  startEl.querySelector('[data-mode="pvp"]').onclick=()=> startGame('pvp');
  // ---------- the four lords: portraits + taglines ----------
  const CHARS={
    knight:{name:'The Knight', tag:'Eager and reckless. He swings first and thinks after — sometimes he blunders.',
      svg:'<svg viewBox="0 0 64 64"><path d="M32 6 C20 6 14 15 14 26 V40 C14 50 22 56 32 56 C42 56 50 50 50 40 V26 C50 15 44 6 32 6 Z" fill="#8fa3bd"/><path d="M32 6 C20 6 14 15 14 26 V30 H50 V26 C50 15 44 6 32 6 Z" fill="#aebfd6"/><path d="M18 33 H46 V37 H18 Z" fill="#0b1322"/><rect x="21" y="33.6" width="9" height="2.8" fill="#41e2ff"/><rect x="34" y="33.6" width="9" height="2.8" fill="#41e2ff"/><path d="M30 6 L34 6 L34 -2 L30 -2 Z M28 2 H36 V6 H28 Z" fill="#41e2ff" opacity=".9"/><path d="M24 44 H40 V47 H24 Z M26 49 H38 V52 H26 Z" fill="#5f7391"/></svg>'},
    prince:{name:'The Prince', tag:'Patient and sharp. He sees the trap before you have set it.',
      svg:'<svg viewBox="0 0 64 64"><path d="M32 12 C23 12 18 19 18 28 C18 40 24 50 32 50 C40 50 46 40 46 28 C46 19 41 12 32 12 Z" fill="#c9a37d"/><path d="M18 26 C18 16 24 10 32 10 C40 10 46 16 46 26 L42 22 L38 26 L32 21 L26 26 L22 22 Z" fill="#3a2a55"/><path d="M20 20 H44 V23 H20 Z" fill="#b26bff"/><circle cx="32" cy="21.5" r="3" fill="#41e2ff"/><circle cx="26.5" cy="30" r="1.8" fill="#241a38"/><circle cx="37.5" cy="30" r="1.8" fill="#241a38"/><path d="M28 40 C30 42 34 42 36 40" stroke="#241a38" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>'},
    king:{name:'The King', tag:'Five moves deep and never hurried. Respect the crown.',
      svg:'<svg viewBox="0 0 64 64"><path d="M32 14 C23 14 18 21 18 30 C18 41 24 50 32 50 C40 50 46 41 46 30 C46 21 41 14 32 14 Z" fill="#c9a37d"/><path d="M22 40 C22 50 26 54 32 54 C38 54 42 50 42 40 L40 44 H24 Z" fill="#e8e3f5"/><path d="M17 22 L21 12 L26 19 L32 9 L38 19 L43 12 L47 22 Z" fill="#e9a530"/><rect x="17" y="21" width="30" height="4" rx="1.5" fill="#ffe2a0"/><circle cx="21" cy="12" r="2.2" fill="#ffe2a0"/><circle cx="32" cy="9" r="2.2" fill="#ffe2a0"/><circle cx="43" cy="12" r="2.2" fill="#ffe2a0"/><circle cx="26.5" cy="31" r="1.8" fill="#241a38"/><circle cx="37.5" cy="31" r="1.8" fill="#241a38"/></svg>'},
    superking:{name:'The Superking', tag:'He has already seen how this ends. Strike last — if he lets you strike at all.',
      svg:'<svg viewBox="0 0 64 64"><path d="M32 16 C23 16 18 23 18 31 C18 42 24 52 32 52 C40 52 46 42 46 31 C46 23 41 16 32 16 Z" fill="#2b2140"/><path d="M15 24 L19 8 L25 18 L32 5 L39 18 L45 8 L49 24 Z" fill="#ff3ec8"/><rect x="15" y="23" width="34" height="4.5" rx="1.5" fill="#ff8fdd"/><circle cx="19" cy="8" r="2.4" fill="#ff8fdd"/><circle cx="32" cy="5" r="2.4" fill="#ff8fdd"/><circle cx="45" cy="8" r="2.4" fill="#ff8fdd"/><path d="M23 32 L30 34 M41 32 L34 34" stroke="#ff3ec8" stroke-width="3.2" stroke-linecap="round"/><path d="M27 45 C30 43.5 34 43.5 37 45" stroke="#ff3ec8" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>'}
  };
  document.querySelectorAll('.lvl-face').forEach(el=>{ el.innerHTML = CHARS[el.dataset.face].svg; });

  function showEncounter(lvl){
    const ch=CHARS[lvl];
    showOverlay('<div class="vs-face">'+ch.svg+'</div>'+
      '<p class="vs-eyebrow">You face</p>'+
      '<h2 class="vs-name '+lvl+'">'+ch.name+'</h2>'+
      '<p class="vs-tag">'+ch.tag+'</p>'+
      '<div class="vs-row"><button class="ghost" id="vs-back">Back</button><button id="vs-begin">Begin</button></div>');
    document.getElementById('vs-back').onclick=hideOverlay;
    document.getElementById('vs-begin').onclick=()=>{ hideOverlay(); startGame('cpu', lvl); };
  }
  startEl.querySelectorAll('.lvl-btn').forEach(b=> b.onclick=()=> showEncounter(b.dataset.level));

  // opening splash: tap to enter
  const splashEl=document.getElementById('splash');
  splashEl.addEventListener('pointerdown', ()=> splashEl.classList.add('hide'), {once:true});
  document.getElementById('ver').textContent=VERSION;

  // boot: prime a board behind the start screen
  buildBoard(3,3,3); applyBoardLayout();
  score={S:0,G:0}; cells=new Array(N).fill(null); turn='S'; selected=null; lastMove={S:null,G:null};
  busy=false; matchOver=false; render();
  // keep it fullscreen: stop iOS double-tap and pinch zoom
  ['gesturestart','gesturechange','gestureend'].forEach(ev=> document.addEventListener(ev, e=> e.preventDefault()));
  document.addEventListener('dblclick', e=> e.preventDefault(), {passive:false});
})();
</script>
</body>
</html>
